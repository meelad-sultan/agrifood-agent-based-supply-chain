# Default configuration. ALL numbers are ILLUSTRATIVE (no calibration to real firms); units are arbitrary product units per week.
seed: 20261020
horizon_weeks: 156
warmup_weeks: 26                 # excluded from every metric

farmers:                         # names and coordinates only give the climate shocks a plausible spatial correlation
  names: [Friesland, Gelderland, Noord-Brabant, Overijssel, Utrecht, Noord-Holland]
  lat: [53.10, 52.05, 51.50, 52.45, 52.10, 52.60]
  lon: [5.80, 5.90, 5.20, 6.40, 5.10, 4.80]
  capacity: [95, 85, 75, 65, 55, 55]              # production units per week at the seasonal mean (total 430, 7.5 % above mean demand)
processors:
  capacity: [260, 200, 200]                       # raw intake / processing limit per week (processor 0 serves two retailers)
retailers:
  base_demand: [120, 100, 90, 90]                 # units per week at the seasonal mean (total 400)
  home_processor: [0, 0, 1, 2]                    # each retailer is served by one processor (decentralised regimes)

demand: {seasonal_amp: 0.10, noise_cv: 0.15, ar_phi: 0.5, common_share: 0.5}
supply: {seasonal_amp: 0.12, noise_cv: 0.03, shock_scale: 1.0, shock_window_weeks: [18, 36], ramp_weeks: 4}
climate: {corr_length_km: 200, df: 4, skew_a: -4.0, loc: 0.08, scale: 0.12}

spoilage: {retailer: 0.05, processor: 0.01}       # fraction of stock lost per week
costs: {hold_retailer: 0.4, hold_processor: 0.1, shortage: 4.0, spoil: 1.0, raw_waste: 0.3}

policy:
  alpha: 0.2                      # smoothing weight for processor forecasts (orders received, or shared sales data)
  alpha_retailer: 0.3             # smoothing weight for retailers' own demand forecasts (more reactive; an explicit assumption)
  alpha_sigma: 0.1                # smoothing weight for the forecast-error variance
  beta: 1.0                       # order smoothing: 1 = pure order-up-to, <1 = move gradually toward the target
  cover_retailer: 2.0             # target inventory position in weeks of forecast demand
  cover_processor: 2.0
  z_retailer: 1.28                # safety factor (about 90 % cycle service level)
  z_processor: 1.28
  gaming: 0.0                     # order inflation after a rationed shipment: q *= 1 + gaming * (1 - fill ratio)
  supply_forecast: {horizon_weeks: 10, noise_cv: 0.0, theta: 1.0, max_build_weeks: 4.0}
  central: {horizon_weeks: 6, z: 1.28}

regimes: [none, pos, vmi, full, central]
experiments:
  regimes: {reps: 30, shock_scale: 1.0}
  shock_sweep: {reps: 20, scales: [0.0, 1.0, 2.0, 3.0]}
  policy_map: {reps: 15, alphas: [0.1, 0.3, 0.5, 0.8], betas: [0.25, 0.5, 1.0], regimes: [none, vmi]}
  gaming: {reps: 20, values: [0.0, 0.25, 0.5, 1.0], shock_scale: 3.0, regimes: [none, pos, vmi]}
  forecast_noise: {reps: 20, values: [0.0, 0.5, 1.0], shock_scale: 3.0, regimes: [full, central]}
  tuning: {reps: 6, covers: [0.5, 1.0, 1.5, 2.0], zs: [1.0, 1.28, 1.65], thetas: [0.0, 0.5, 1.0], regimes: [none, pos, vmi, full], seed_offset: 5000}
